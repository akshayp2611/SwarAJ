<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SwarAJ Admin</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #08080d;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 900px;
      width: 94%;
      margin: 30px auto 100px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #999;
      margin-bottom: 25px;
    }

    .card {
      background: #15151d;
      border: 1px solid #292936;
      border-radius: 18px;
      padding: 25px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #333340;
      background: #0b0b11;
      color: white;
      font-size: 15px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    input[type="checkbox"] {
      width: auto;
      margin-right: 8px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 25px;
      border: 0;
      border-radius: 10px;
      background: #8b5cf6;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #101018;
      border: 1px solid #292936;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.6;
    }

    .help {
      margin-top: 20px;
      padding: 18px;
      background: #101018;
      border-radius: 12px;
      color: #aaa;
      line-height: 1.7;
    }

    code {
      color: #c4b5fd;
    }

  </style>

</head>

<body>

<div class="container">

  <h1>🎵 स्वरAJ Admin</h1>

  <div class="subtitle">
    Add songs to your SwarAJ library
  </div>

  <form
    id="uploadForm"
    class="card"
  >

    <label>
      Song Title *
    </label>

    <input
      type="text"
      name="title"
      placeholder="Song title"
      required
    >

    <label>
      Artist
    </label>

    <input
      type="text"
      name="artist"
      placeholder="Artist name"
    >

    <label>
      Album
    </label>

    <input
      type="text"
      name="album"
      placeholder="Album name"
    >

    <label>
      Category
    </label>

    <select name="category">

      <option>Bhakti</option>
      <option>Marathi</option>
      <option>Hindi</option>
      <option>Love</option>
      <option>Energetic</option>
      <option>Emotional</option>
      <option>Party</option>
      <option>Devotional</option>
      <option>Instrumental</option>

    </select>

    <label>
      Language
    </label>

    <input
      type="text"
      name="language"
      placeholder="Marathi"
    >

    <label>
      Genre
    </label>

    <input
      type="text"
      name="genre"
      placeholder="Devotional"
    >

    <label>
      MP3 URL
    </label>

    <input
      type="text"
      name="audio_url"
      placeholder="https://example.com/song.mp3"
    >

    <label>
      YouTube URL
    </label>

    <input
      type="text"
      name="youtube_url"
      placeholder="https://youtu.be/VIDEO_ID"
    >

    <label>
      OR Upload MP3
    </label>

    <input
      type="file"
      name="audio"
      accept=".mp3,audio/mpeg,audio/*"
    >

    <label>
      Cover Image URL
    </label>

    <input
      type="text"
      name="cover_url"
      placeholder="https://example.com/cover.jpg"
    >

    <label>
      Lyrics
    </label>

    <textarea
      name="lyrics"
      placeholder="Lyrics..."
    ></textarea>

    <label>

      <input
        type="checkbox"
        name="featured"
        value="true"
      >

      Featured song

    </label>

    <button
      id="submitButton"
      type="submit"
    >
      🎵 ADD SONG
    </button>

  </form>

  <div
    id="result"
    class="result"
  >
    Ready.
  </div>

  <div class="help">

    <strong>Three ways to add a song:</strong>

    <br><br>

    1. Direct MP3 URL

    <br>

    <code>
      https://example.com/song.mp3
    </code>

    <br><br>

    2. YouTube URL

    <br>

    <code>
      https://youtu.be/VIDEO_ID
    </code>

    <br><br>

    3. Upload an MP3.

    The server uploads it to Cloudinary.

  </div>

</div>

<script>

const form =
  document.getElementById(
    "uploadForm"
  );

const result =
  document.getElementById(
    "result"
  );

const button =
  document.getElementById(
    "submitButton"
  );

form.addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();

    button.disabled = true;

    button.textContent =
      "⏳ Adding...";

    result.textContent =
      "Uploading / saving song...";

    try {

      const formData =
        new FormData(form);

      const response =
        await fetch(
          "/api/admin/upload-song",
          {
            method: "POST",
            body: formData
          }
        );

      const text =
        await response.text();

      let data;

      try {
        data =
          JSON.parse(text);
      } catch {
        data = {
          error: text
        };
      }

      if (!response.ok) {

        throw new Error(
          [
            data.error,
            data.details,
            data.code
              ? `Code: ${data.code}`
              : "",
            data.detail
              ? `Detail: ${data.detail}`
              : "",
            data.hint
              ? `Hint: ${data.hint}`
              : ""
          ]
            .filter(Boolean)
            .join("\n")
        );

      }

      result.textContent =
        [
          "✅ SONG ADDED SUCCESSFULLY",
          "",
          `ID: ${data.song.id}`,
          `Title: ${data.song.title}`,
          `Artist: ${data.song.artist || "-"}`,
          `Category: ${data.song.category}`,
          "",
          "MP3 URL:",
          data.song.audio_url ||
            "Not provided",
          "",
          "YouTube URL:",
          data.song.youtube_url ||
            "Not provided"
        ].join("\n");

      form.reset();

    } catch (error) {

      result.textContent =
        [
          "❌ ERROR",
          "",
          error.message ||
            "Unknown error"
        ].join("\n");

      console.error(error);

    } finally {

      button.disabled = false;

      button.textContent =
        "🎵 ADD SONG";

    }

  }
);

</script>

</body>

</html>
