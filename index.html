<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#08080f">

  <title>स्वरAJ — Music</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="swaraj-final.css">
</head>

<body>

  <!-- Animated liquid background -->
  <div class="liquid-background">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- ================= SIDEBAR ================= -->

  <aside id="sidebar" class="sidebar">

    <div class="brand">
      <div class="brand-logo">स्व</div>

      <div class="brand-text">
        <strong>स्वरAJ</strong>
        <small>MUSIC</small>
      </div>
    </div>

    <nav class="navigation">

      <button
        class="nav-item active"
        data-view="home"
        type="button"
      >
        <span class="nav-icon">⌂</span>
        <span>Home</span>
      </button>

      <button
        class="nav-item"
        data-view="liked"
        type="button"
      >
        <span class="nav-icon">♡</span>
        <span>Liked Songs</span>
      </button>

      <button
        class="nav-item"
        data-view="library"
        type="button"
      >
        <span class="nav-icon">▤</span>
        <span>Library</span>
      </button>

      <button
        class="nav-item"
        data-view="categories"
        type="button"
      >
        <span class="nav-icon">◈</span>
        <span>Categories</span>
      </button>

    </nav>

    <button
      id="themeToggle"
      class="theme-open-button"
      type="button"
    >
      ◈ Themes
    </button>

  </aside>

  <!-- ================= MAIN ================= -->

  <main class="main">

    <!-- Top bar -->

    <header class="topbar">

      <button
        id="mobileMenu"
        class="icon-button mobile-menu"
        type="button"
        aria-label="Menu"
      >
        ☰
      </button>

      <div class="search-container">

        <span class="search-icon">⌕</span>

        <input
          id="searchInput"
          type="search"
          autocomplete="off"
          placeholder="Search songs, artists or categories..."
        >

        <button
          id="clearSearch"
          class="clear-search"
          type="button"
          hidden
        >
          ×
        </button>

      </div>

      <button
        id="refreshBtn"
        class="icon-button"
        type="button"
        title="Refresh songs"
      >
        ↻
      </button>

      <!-- Admin is intentionally separate from normal navigation -->
      <a
        href="/admin.html"
        class="icon-button admin-button"
        title="Admin"
        aria-label="Admin"
      >
        ⚙
      </a>

    </header>

    <!-- ================= CONTENT ================= -->

    <div class="content">

      <!-- Hero -->

      <section class="hero">

        <div class="hero-content">

          <div class="eyebrow">
            YOUR MUSIC • YOUR SWARAJ
          </div>

          <h1>
            Listen to
            <span>what you love.</span>
          </h1>

          <p>
            Your music collection, automatically organised
            category-wise.
          </p>

        </div>

      </section>

      <!-- Categories -->

      <section class="section">

        <div class="section-header">

          <div>
            <h2>Categories</h2>
          </div>

          <span
            id="songCount"
            class="muted"
          >
            0 songs
          </span>

        </div>

        <div
          id="categoryBar"
          class="category-bar"
        ></div>

      </section>

      <!-- Songs -->

      <section class="section">

        <div class="section-header">

          <h2 id="sectionTitle">
            All Songs
          </h2>

        </div>

        <div
          id="songGrid"
          class="song-grid"
        >
          <div class="loading">
            Loading songs...
          </div>
        </div>

      </section>

    </div>

  </main>

  <!-- ================= THEME PANEL ================= -->

  <aside
    id="themePanel"
    class="theme-panel"
  >

    <div class="theme-panel-header">

      <strong>
        Choose Theme
      </strong>

      <button
        id="themeClose"
        class="icon-button"
        type="button"
      >
        ×
      </button>

    </div>

    <div
      id="themeGrid"
      class="theme-grid"
    ></div>

  </aside>

  <!-- ================= YOUTUBE VIDEO ================= -->

  <div
    id="videoModal"
    class="video-modal hidden"
  >

    <div class="video-dialog">

      <button
        id="videoClose"
        class="video-close"
        type="button"
      >
        ×
      </button>

      <div
        id="youtubeFrame"
        class="youtube-frame"
      ></div>

    </div>

  </div>

  <!-- ================= TOAST ================= -->

  <div
    id="toast"
    class="toast"
  ></div>

  <!-- ================= AUDIO ================= -->

  <audio
    id="audioPlayer"
    preload="metadata"
    playsinline
  ></audio>

  <!-- ================= PLAYER ================= -->

  <footer class="player">

    <!-- Song information -->

    <div class="now-playing">

      <div
        id="playerCover"
        class="player-cover"
      >
        ♪
      </div>

      <div class="now-playing-text">

        <strong id="playerTitle">
          Nothing playing
        </strong>

        <small id="playerArtist">
          SwarAJ
        </small>

      </div>

      <button
        id="likeBtn"
        class="player-icon"
        type="button"
        title="Like"
      >
        ♡
      </button>

    </div>

    <!-- Controls -->

    <div class="player-center">

      <div class="player-controls">

        <button
          id="shuffleBtn"
          class="player-icon"
          type="button"
          title="Shuffle"
        >
          ⤨
        </button>

        <button
          id="prevBtn"
          class="player-icon"
          type="button"
          title="Previous"
        >
          ⏮
        </button>

        <button
          id="playBtn"
          class="play-button"
          type="button"
          title="Play"
        >
          ▶
        </button>

        <button
          id="nextBtn"
          class="player-icon"
          type="button"
          title="Next"
        >
          ⏭
        </button>

        <button
          id="repeatBtn"
          class="player-icon"
          type="button"
          title="Repeat"
        >
          ↻
        </button>

      </div>

      <div class="timeline">

        <span id="currentTime">
          0:00
        </span>

        <input
          id="seekBar"
          type="range"
          min="0"
          max="100"
          value="0"
          step="0.1"
        >

        <span id="duration">
          0:00
        </span>

      </div>

    </div>

    <!-- Right controls -->

    <div class="player-right">

      <button
        id="watchBtn"
        class="watch-button"
        type="button"
        hidden
      >
        ▷ Watch
      </button>

      <button
        id="muteBtn"
        class="player-icon"
        type="button"
        title="Mute"
      >
        🔊
      </button>

      <input
        id="volumeBar"
        type="range"
        min="0"
        max="1"
        value="1"
        step="0.01"
      >

    </div>

  </footer>

  <script src="script.js"></script>
  <script src="swaraj-final.js"></script>

</body>
</html>
