<div class="music-player">

    <div class="player-song">

        <img
            id="playerCover"
            src="/images/ganpati.jpg"
            alt="Now Playing"
        >

        <div>
            <strong id="playerTitle">
                Select a song
            </strong>

            <span id="playerArtist">
                SwarAJ
            </span>
        </div>

    </div>

    <div class="player-controls">

        <button
            id="shuffleBtn"
            title="Shuffle"
        >
            🔀
        </button>

        <button
            id="previousBtn"
            title="Previous"
        >
            ⏮
        </button>

        <button
            id="playPauseBtn"
            class="main-play"
            title="Play / Pause"
        >
            ▶
        </button>

        <button
            id="nextBtn"
            title="Next"
        >
            ⏭
        </button>

        <button
            id="repeatBtn"
            title="Repeat"
        >
            🔁
        </button>

    </div>

</div>

<div
    id="youtubePlayer"
    class="youtube-player"
></div>
