<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>स्वरAJ Music</title>

  <link
    rel="stylesheet"
    href="/styles.css"
  >

</head>

<body>

<header>

  <div class="logo">
    स्वरAJ
  </div>

  <nav>

    <a href="/">
      ⌂ Home
    </a>

    <a href="#songs">
      ♫ All Songs
    </a>

    <a href="#categories">
      Categories
    </a>

    <a href="/admin">
      Admin
    </a>

  </nav>

</header>

<main>

<section class="hero">

  <div>

    <p class="small">
      WELCOME TO स्वरAJ
    </p>

    <h1>
      Music for<br>
      Every Mood
    </h1>

    <p>
      Your personal premium music library.
      Discover, play and enjoy your music
      anytime, anywhere.
    </p>

    <a
      class="button"
      href="#songs"
    >
      Explore Now →
    </a>

  </div>

</section>

<section id="categories">

  <h2>
    Categories
  </h2>

  <div
    id="categoryList"
    class="categories"
  >
    Loading...
  </div>

</section>

<section id="songs">

  <h2>
    All Songs
  </h2>

  <div
    id="songList"
    class="songs"
  >
    Loading songs...
  </div>

</section>

</main>

<div class="player">

  <div>

    <strong id="playerTitle">
      Select a song
    </strong>

    <small id="playerArtist">
      स्वरAJ
    </small>

  </div>

  <audio
    id="audioPlayer"
    controls
    preload="metadata"
  ></audio>

</div>

<script src="/script.js"></script>

</body>

</html>
