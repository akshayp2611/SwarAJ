<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>स्वरAJ — Music</title>

  <link
    rel="stylesheet"
    href="/styles.css"
  >
</head>

<body>

  <div class="app">

    <aside class="sidebar">

      <div class="brand">
        <span>स्वर</span><b>AJ</b>
      </div>

      <nav>
        <button data-tab="home">
          🏠 Home
        </button>

        <button data-tab="music">
          🎵 Music
        </button>

        <button data-tab="youtube">
          ▶ YouTube
        </button>

        <button data-tab="library">
          ❤️ Library
        </button>

        <button data-tab="admin">
          ⚙ Admin
        </button>
      </nav>

    </aside>

    <main>

      <header class="topbar">

        <div class="mobile-brand">
          स्वर<b>AJ</b>
        </div>

        <input
          id="searchInput"
          type="search"
          placeholder="Search songs, artists..."
        >

      </header>

      <section
        id="home"
        class="page active"
      >

        <div class="hero">
          <div>
            <span class="eyebrow">
              PREMIUM MUSIC
            </span>

            <h1>
              Welcome to
              <strong>स्वरAJ</strong>
            </h1>

            <p>
              Your music. Your mood. Your SwarAJ.
            </p>
          </div>
        </div>

        <h2>Recently Added</h2>

        <div
          id="recentSongs"
          class="song-grid"
        ></div>

      </section>

      <section
        id="music"
        class="page"
      >

        <h1>🎵 Music</h1>

        <div
          id="categories"
          class="chips"
        ></div>

        <div
          id="musicSongs"
          class="song-grid"
        ></div>

      </section>

      <section
        id="youtube"
        class="page"
      >

        <h1>▶ YouTube</h1>

        <p class="muted">
          YouTube songs play directly inside SwarAJ.
        </p>

        <div
          id="youtubeSongs"
          class="song-grid"
        ></div>

      </section>

      <section
        id="library"
        class="page"
      >

        <h1>❤️ Library</h1>

        <div
          id="librarySongs"
          class="song-grid"
        ></div>

      </section>

      <section
        id="admin"
        class="page"
      >

        <h1>⚙ Admin</h1>

        <div class="admin-card">

          <h2>Add YouTube Song</h2>

          <form id="youtubeForm">

            <input
              name="title"
              placeholder="Title"
              required
            >

            <input
              name="artist"
              placeholder="Artist"
            >

            <input
              name="album"
              placeholder="Album"
            >

            <input
              name="category"
              placeholder="Category"
              value="Bhakti"
            >

            <input
              name="language"
              placeholder="Language"
              value="Marathi"
            >

            <input
              name="youtube_url"
              placeholder="YouTube URL"
              required
            >

            <input
              name="cover_url"
              placeholder="Cover URL"
            >

            <button>
              ▶ Add YouTube Song
            </button>

          </form>

        </div>

        <div class="admin-card">

          <h2>Add MP3 Song</h2>

          <form id="mp3Form">

            <input
              name="title"
              placeholder="Title"
              required
            >

            <input
              name="artist"
              placeholder="Artist"
            >

            <input
              name="album"
              placeholder="Album"
            >

            <input
              name="category"
              placeholder="Category"
              value="Marathi"
            >

            <input
              name="language"
              placeholder="Language"
              value="Marathi"
            >

            <input
              name="audio"
              type="file"
              accept=".mp3,.wav,.m4a,.ogg"
              required
            >

            <input
              name="cover"
              type="file"
              accept="image/*"
            >

            <button>
              🎵 Add MP3 Song
            </button>

          </form>

        </div>

      </section>

    </main>

  </div>

  <!-- Full player -->

  <div
    id="player"
    class="player"
  >

    <div class="player-info">

      <img
        id="playerCover"
        src="/images/ganpati.jpg"
        alt=""
      >

      <div>
        <strong id="playerTitle">
          Select a song
        </strong>

        <span id="playerArtist">
          SwarAJ
        </span>
      </div>

    </div>

    <div class="player-controls">

      <button id="previous">
        ⏮
      </button>

      <button
        id="playPause"
        class="play"
      >
        ▶
      </button>

      <button id="next">
        ⏭
      </button>

      <button id="shuffle">
        🔀
      </button>

      <button id="repeat">
        🔁
      </button>

    </div>

    <div class="progress">

      <span id="currentTime">
        0:00
      </span>

      <input
        id="progressBar"
        type="range"
        min="0"
        max="100"
        value="0"
      >

      <span id="duration">
        0:00
      </span>

    </div>

    <div class="youtube-container">

      <div
        id="youtubePlayer"
      ></div>

      <button
        id="videoModeButton"
        class="video-button hidden"
      >
        🎬 Watch Video
      </button>

      <button
        id="musicModeButton"
        class="video-button hidden"
      >
        🎵 Music Mode
      </button>

    </div>

    <audio
      id="audio"
      preload="metadata"
    ></audio>

  </div>

  <div
    id="toast"
    class="toast"
  ></div>

  <script src="/script.js"></script>

</body>
</html>
