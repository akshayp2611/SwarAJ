<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SwarAJ Admin</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Arial,
        sans-serif;

      background:
        #08080d;

      color: white;
    }

    .container {
      max-width: 900px;
      width: 94%;
      margin: 40px auto;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #999;
      margin-bottom: 25px;
    }

    form {
      background: #15151d;
      border: 1px solid #292936;
      border-radius: 18px;
      padding: 25px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #333340;
      background: #0b0b11;
      color: white;
      font-size: 15px;
    }

    textarea {
      min-height: 120px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 25px;
      border: none;
      border-radius: 10px;
      background: #8b5cf6;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #111119;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .info {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #111119;
      color: #aaa;
      line-height: 1.6;
    }

  </style>

</head>

<body>

<div class="container">

  <h1>🎵 स्वरAJ Admin</h1>

  <div class="subtitle">
    Add and manage your SwarAJ music library
  </div>

  <form id="uploadForm">

    <label>
      Song Title *
    </label>

    <input
      type="text"
      name="title"
      placeholder="Ganpati Bappa Morya"
      required
    >

    <label>
      Artist
    </label>

    <input
      type="text"
      name="artist"
      placeholder="Artist name"
    >

    <label>
      Album
    </label>

    <input
      type="text"
      name="album"
      placeholder="Album name"
    >

    <label>
      Category
    </label>

    <select name="category">

      <option>
        Bhakti
      </option>

      <option>
        Marathi
      </option>

      <option>
        Hindi
      </option>

      <option>
        Love
      </option>

      <option>
        Energetic
      </option>

      <option>
        Emotional
      </option>

      <option>
        Party
      </option>

      <option>
        Devotional
      </option>

      <option>
        Instrumental
      </option>

    </select>

    <label>
      Language
    </label>

    <input
      type="text"
      name="language"
      placeholder="Marathi"
    >

    <label>
      Genre
    </label>

    <input
      type="text"
      name="genre"
      placeholder="Devotional"
    >

    <label>
      MP3 URL
    </label>

    <input
      type="text"
      name="audio_url"
      placeholder="https://your-storage.com/song.mp3"
    >

    <label>
      YouTube URL
    </label>

    <input
      type="text"
      name="youtube_url"
      placeholder="https://youtu.be/w-ocXpNDCkI"
    >

    <label>
      Upload MP3 to Cloudinary
    </label>

    <input
      type="file"
      name="audio"
      accept=".mp3,audio/mpeg,audio/*"
    >

    <label>
      Cover URL
    </label>

    <input
      type="text"
      name="cover_url"
      placeholder="https://your-storage.com/cover.jpg"
    >

    <label>
      Lyrics
    </label>

    <textarea
      name="lyrics"
      placeholder="Enter lyrics..."
    ></textarea>

    <label>

      <input
        type="checkbox"
        name="featured"
        value="true"
        style="width:auto"
      >

      Featured Song

    </label>

    <button type="submit">
      🎵 ADD SONG
    </button>

  </form>

  <div
    id="result"
    class="result"
  >
    Ready.
  </div>

  <div class="info">

    <strong>MP3:</strong>

    Use a direct MP3 URL or upload an MP3.

    <br>

    <strong>YouTube:</strong>

    Paste the YouTube video URL.

    <br>

    <strong>Example:</strong>

    https://youtu.be/w-ocXpNDCkI

  </div>

</div>

<script>

const form =
  document.getElementById(
    "uploadForm"
  );

const result =
  document.getElementById(
    "result"
  );

form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    result.textContent =
      "⏳ Adding song...";

    try {

      const formData =
        new FormData(form);

      const response =
        await fetch(
          "/api/admin/upload-song",
          {
            method: "POST",
            body: formData
          }
        );

      const data =
        await response.json();

      if (!response.ok) {
        throw new Error(
          data.error ||
          data.details ||
          "Upload failed"
        );
      }

      result.textContent =
        "✅ SONG ADDED\n\n" +

        "Title: " +
        data.song.title +

        "\n\nMP3 URL:\n" +
        (
          data.song.audio_url ||
          "Not provided"
        ) +

        "\n\nYouTube URL:\n" +
        (
          data.song.youtube_url ||
          "Not provided"
        );

      form.reset();

    } catch (error) {

      result.textContent =
        "❌ ERROR\n\n" +
        error.message;

    }

  });

</script>

</body>

</html>
