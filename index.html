<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#08080f"
  >

  <meta
    name="description"
    content="SwarAJ — Premium Music Player"
  >

  <title>स्वरAJ — Music</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="swaraj-enhancements.css">
  <link rel="stylesheet" href="swaraj-final.css">
</head>

<body>

  <!-- =====================================================
       LIQUID BACKGROUND
       ===================================================== -->

  <div
    class="liquid-background"
    aria-hidden="true"
  >
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>


  <!-- =====================================================
       SIDEBAR
       ===================================================== -->

  <aside
    id="sidebar"
    class="sidebar"
  >

    <div class="brand">

      <div class="brand-logo">
        स्व
      </div>

      <div class="brand-text">

        <strong>
          स्वरAJ
        </strong>

        <small>
          MUSIC
        </small>

      </div>

    </div>


    <nav class="navigation">

      <button
        class="nav-item active"
        data-view="home"
        type="button"
      >
        <span class="nav-icon">⌂</span>
        <span>Home</span>
      </button>


      <button
        class="nav-item"
        data-view="liked"
        type="button"
      >
        <span class="nav-icon">♡</span>
        <span>Liked Songs</span>
      </button>


      <button
        class="nav-item"
        data-view="library"
        type="button"
      >
        <span class="nav-icon">▤</span>
        <span>Library</span>
      </button>


      <button
        class="nav-item"
        data-view="categories"
        type="button"
      >
        <span class="nav-icon">◈</span>
        <span>Categories</span>
      </button>

    </nav>


    <button
      id="themeToggle"
      class="theme-open-button"
      type="button"
    >
      ◈ Themes
    </button>

  </aside>


  <!-- =====================================================
       MAIN
       ===================================================== -->

  <main class="main">

    <header class="topbar">

      <button
        id="mobileMenu"
        class="icon-button mobile-menu"
        type="button"
        aria-label="Menu"
      >
        ☰
      </button>


      <div class="search-container">

        <span class="search-icon">
          ⌕
        </span>

        <input
          id="searchInput"
          type="search"
          autocomplete="off"
          placeholder="Search songs, artists or categories..."
        >

        <button
          id="clearSearch"
          class="clear-search"
          type="button"
          hidden
        >
          ×
        </button>

      </div>


      <button
        id="refreshBtn"
        class="icon-button"
        type="button"
        title="Refresh songs"
        aria-label="Refresh songs"
      >
        ↻
      </button>


      <!-- Admin remains separate -->
      <a
        href="/admin.html"
        class="icon-button admin-button"
        title="Admin"
        aria-label="Admin"
      >
        ⚙
      </a>

    </header>


    <!-- ===================================================
         CONTENT
         =================================================== -->

    <div class="content">


      <!-- HERO -->

      <section class="hero">

        <div class="hero-content">

          <div class="eyebrow">
            YOUR MUSIC • YOUR SWARAJ
          </div>

          <h1>
            Listen to
            <span>what you love.</span>
          </h1>

          <p>
            Your music collection,
            automatically organised
            category-wise.
          </p>

        </div>

      </section>


      <!-- =================================================
           CATEGORIES
           ================================================= -->

      <section class="section">

        <div class="section-header">

          <div>
            <h2>
              Categories
            </h2>
          </div>

          <span
            id="songCount"
            class="muted"
          >
            0 songs
          </span>

        </div>


        <div
          id="categoryBar"
          class="category-bar"
        ></div>

      </section>


      <!-- =================================================
           SONGS
           ================================================= -->

      <section class="section">

        <div class="section-header">

          <h2 id="sectionTitle">
            All Songs
          </h2>

        </div>


        <div
          id="songGrid"
          class="song-grid"
        >

          <div class="loading">
            Loading songs...
          </div>

        </div>

      </section>

    </div>

  </main>


  <!-- =====================================================
       THEME PANEL
       ===================================================== -->

  <aside
    id="themePanel"
    class="theme-panel"
    aria-hidden="true"
  >

    <div class="theme-panel-header">

      <strong>
        Choose Theme
      </strong>

      <button
        id="themeClose"
        class="icon-button"
        type="button"
        aria-label="Close themes"
      >
        ×
      </button>

    </div>


    <div
      id="themeGrid"
      class="theme-grid"
    ></div>

  </aside>


  <!-- =====================================================
       YOUTUBE VIDEO MODAL
       ===================================================== -->

  <div
    id="videoModal"
    class="video-modal hidden"
    aria-hidden="true"
  >

    <div class="video-dialog">

      <button
        id="videoClose"
        class="video-close"
        type="button"
        aria-label="Close video"
      >
        ×
      </button>


      <div
        id="youtubeFrame"
        class="youtube-frame"
      ></div>

    </div>

  </div>


  <!-- =====================================================
       TOAST
       ===================================================== -->

  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
  ></div>


  <!-- =====================================================
       LOCAL AUDIO
       ===================================================== -->

  <audio
    id="audioPlayer"
    preload="metadata"
    playsinline
    webkit-playsinline
  ></audio>


  <!-- =====================================================
       HIDDEN YOUTUBE BACKGROUND PLAYER

       This is NOT the Watch video.

       It is used only for YouTube background audio.
       ===================================================== -->

  <div
    id="youtubeAudioPlayer"
    aria-hidden="true"
  ></div>


  <!-- =====================================================
       PLAYER
       ===================================================== -->

  <footer class="player">


    <!-- NOW PLAYING -->

    <div class="now-playing">

      <div
        id="playerCover"
        class="player-cover"
      >
        ♪
      </div>


      <div class="now-playing-text">

        <strong id="playerTitle">
          Nothing playing
        </strong>

        <small id="playerArtist">
          SwarAJ
        </small>

      </div>


      <button
        id="likeBtn"
        class="player-icon"
        type="button"
        title="Like"
        aria-label="Like"
      >
        ♡
      </button>

    </div>


    <!-- CENTER CONTROLS -->

    <div class="player-center">

      <div class="player-controls">


        <button
          id="shuffleBtn"
          class="player-icon"
          type="button"
          title="Shuffle"
          aria-label="Shuffle"
        >
          ⤨
        </button>


        <button
          id="prevBtn"
          class="player-icon"
          type="button"
          title="Previous"
          aria-label="Previous"
        >
          ⏮
        </button>


        <button
          id="playBtn"
          class="play-button"
          type="button"
          title="Play"
          aria-label="Play"
        >
          ▶
        </button>


        <button
          id="nextBtn"
          class="player-icon"
          type="button"
          title="Next"
          aria-label="Next"
        >
          ⏭
        </button>


        <button
          id="repeatBtn"
          class="player-icon"
          type="button"
          title="Repeat"
          aria-label="Repeat"
        >
          ↻
        </button>

      </div>


      <div class="timeline">

        <span id="currentTime">
          0:00
        </span>


        <input
          id="seekBar"
          type="range"
          min="0"
          max="100"
          value="0"
          step="0.1"
          aria-label="Song progress"
        >


        <span id="duration">
          0:00
        </span>

      </div>

    </div>


    <!-- RIGHT -->

    <div class="player-right">

      <button
        id="watchBtn"
        class="watch-button"
        type="button"
        hidden
      >
        ▷ Watch
      </button>


      <button
        id="muteBtn"
        class="player-icon"
        type="button"
        title="Mute"
        aria-label="Mute"
      >
        🔊
      </button>


      <input
        id="volumeBar"
        type="range"
        min="0"
        max="1"
        value="1"
        step="0.01"
        aria-label="Volume"
      >

    </div>

  </footer>


  <!-- =====================================================
       SCRIPTS
       ===================================================== -->

  <script src="script.js"></script>
  <script src="swaraj-final.js"></script>

</body>
</html>
